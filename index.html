<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>瞬息全宇宙：逃离贝果</title>
  <style>
    :root {
      --ui-text: #fff7df;
      --ui-text-muted: rgba(255, 247, 223, 0.92);
      --ui-title-size: 34px;
      --ui-body-size: 16px;
      --ui-button-width: 260px;
      --ui-button-height: 56px;
      --ui-button-font-size: 16px;
      --ui-button-bg: rgba(255, 255, 255, 0.13);
      --ui-button-border: rgba(255, 255, 255, 0.78);
      --ui-gap: 22px;
      --ui-shadow: rgba(5, 5, 16, 0.58);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090909;
      font-family: "Courier New", "Lucida Console", monospace;
      color: var(--ui-text);
      touch-action: none;
      -webkit-font-smoothing: none;
      text-rendering: geometricPrecision;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: min(100vw, calc(100vh * 0.5625));
      height: min(100vh, calc(100vw / 0.5625));
      max-width: 720px;
      max-height: 1280px;
      overflow: hidden;
      background: #111;
    }

    #engine-art-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      background-color: #05050a;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      opacity: 1;
      transform: scale(1);
      pointer-events: none;
    }

    #engine-art-layer.engine-art--zoom {
      animation: storyZoom 2000ms ease forwards;
    }

    #game-canvas {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      touch-action: none;
      z-index: 2;
      opacity: 0;
      transition: opacity 240ms ease;
    }

    #fatal-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      background: rgba(0, 0, 0, 0.86);
      color: var(--ui-text);
      font-size: var(--ui-body-size);
      line-height: 1.5;
      z-index: 10;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .overlay.overlay--show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .overlay.overlay--hide {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    #start-screen,
    #story-screen {
      padding: 0;
      align-items: stretch;
      justify-content: flex-start;
      text-align: left;
      background: #05050a;
      z-index: 9;
      cursor: pointer;
    }

    #opening-art,
    #story-slide {
      display: block;
      position: absolute;
      inset: 0;
      background-color: #05050a;
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      transform: scale(1.02);
    }

    #opening-art {
      animation: openingZoom 6400ms ease-in-out infinite alternate;
    }

    #story-slide.story-slide--play {
      animation: storyZoom 3200ms ease forwards;
    }

    .opening-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(5, 5, 16, 0.18) 0%, rgba(5, 5, 16, 0.04) 46%, rgba(5, 5, 16, 0.72) 100%);
    }

    .opening-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex: 1;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-end;
      width: 100%;
      min-height: 100%;
      padding: max(62px, calc(48px + env(safe-area-inset-top))) 28px max(42px, calc(28px + env(safe-area-inset-bottom)));
      pointer-events: none;
    }

    .opening-copy {
      width: min(520px, 92%);
      color: var(--ui-text);
      font-family: "Courier New", "Lucida Console", monospace;
      text-align: right;
      text-shadow:
        2px 0 0 #080812,
        -2px 0 0 #080812,
        0 2px 0 #080812,
        0 -2px 0 #080812,
        3px 3px 0 rgba(8, 8, 18, 0.78);
    }

    #start-title,
    #story-title {
      margin: 0 0 14px;
      color: var(--ui-text);
      font-size: var(--ui-title-size);
      line-height: 1.2;
      letter-spacing: 0.08em;
    }

    #start-subtitle,
    #story-caption {
      margin: 0 0 0 auto;
      max-width: 480px;
      color: var(--ui-text-muted);
      font-size: var(--ui-body-size);
      line-height: 1.7;
      letter-spacing: 0.03em;
    }

    #music-toggle {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      z-index: 12;
      appearance: none;
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 2px solid var(--ui-button-border);
      border-radius: 50%;
      padding: 0;
      color: var(--ui-text);
      background: var(--ui-button-bg);
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--ui-shadow);
      transition: opacity 160ms ease;
    }

    #music-toggle.music-toggle--game {
      background: var(--ui-button-bg);
    }

    #music-toggle svg {
      width: 22px;
      height: 22px;
      overflow: visible;
      fill: currentColor;
      shape-rendering: crispEdges;
    }

    #music-toggle .speaker-waves,
    #music-toggle[data-state="playing"] .speaker-muted-mark {
      display: none;
    }

    #music-toggle[data-state="playing"] .speaker-waves {
      display: block;
    }

    #music-toggle[data-state="playing"] {
      border-color: var(--ui-button-border);
      background: var(--ui-button-bg);
      box-shadow: 2px 2px 0 var(--ui-shadow);
    }

    #gate-button,
    #victory-button {
      width: min(var(--ui-button-width), 100%);
      min-height: var(--ui-button-height);
      margin-top: var(--ui-gap);
      appearance: none;
      border: 2px solid var(--ui-button-border);
      background: var(--ui-button-bg);
      color: var(--ui-text);
      border-radius: 999px;
      padding: 0 24px;
      font-family: "Courier New", "Lucida Console", monospace;
      font-size: var(--ui-button-font-size);
      font-weight: 700;
      letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ui-shadow);
    }

    #gate-button:active,
    #victory-button:active {
      transform: translateY(1px);
    }

    #gate-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #gate-screen {
      background:
        radial-gradient(circle at 40% 30%, rgba(255, 217, 102, 0.12), transparent 42%),
        radial-gradient(circle at 70% 75%, rgba(116, 242, 206, 0.1), transparent 46%),
        rgba(0, 0, 0, 0.72);
      z-index: 9;
    }

    #gate-title,
    #victory-title {
      margin: 0;
      font-size: var(--ui-title-size);
      letter-spacing: 0.08em;
      color: var(--ui-text);
      font-family: "Courier New", "Lucida Console", monospace;
      text-shadow: 2px 2px 0 rgba(5, 5, 16, 0.82);
    }

    #victory-title {
      margin-top: var(--ui-gap);
    }

    #victory-subtitle {
      margin: 14px 0 0 0;
      max-width: 560px;
      font-size: var(--ui-body-size);
      line-height: 1.8;
      color: var(--ui-text-muted);
    }

    #victory-screen {
      background:
        radial-gradient(circle at 35% 30%, rgba(116, 242, 206, 0.18), transparent 46%),
        radial-gradient(circle at 70% 75%, rgba(255, 217, 102, 0.16), transparent 50%),
        rgba(0, 0, 0, 0.78);
      z-index: 9;
    }

    #victory-ring {
      width: 340px;
      height: 340px;
      border-radius: 999px;
      background: conic-gradient(
        from 0deg,
        rgba(116, 242, 206, 0.0),
        rgba(116, 242, 206, 0.55),
        rgba(255, 217, 102, 0.55),
        rgba(255, 107, 94, 0.45),
        rgba(116, 242, 206, 0.0)
      );
      animation: victorySpin 2200ms linear infinite;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.52);
    }

    #victory-core {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      background: radial-gradient(circle at 40% 35%, rgba(255, 247, 223, 0.12), rgba(0, 0, 0, 0));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 0 0 22px rgba(0, 0, 0, 0.22) inset;
      animation: victoryPulse 1400ms ease-in-out infinite;
    }

    @keyframes storyZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    @keyframes openingZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.05); }
    }

    @keyframes victorySpin {
      to { transform: rotate(360deg); }
    }

    @keyframes victoryPulse {
      0% { transform: scale(0.98); opacity: 0.85; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(0.98); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="engine-art-layer" aria-hidden="true"></div>
    <canvas id="game-canvas" width="720" height="1280" aria-label="瞬息全宇宙：逃离贝果"></canvas>
    <button id="music-toggle" type="button" aria-label="开启音乐" title="开启音乐" aria-pressed="false" data-state="idle">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M1 6h3l4-3v10l-4-3H1z"></path>
        <path class="speaker-waves" d="M10 5h1v1h1v4h-1v1h-1V9h1V7h-1zm2-2h1v1h1v8h-1v1h-1v-2h1V5h-1z"></path>
        <path class="speaker-muted-mark" d="M10 5h1v1h1V5h2v2h-1v2h1v2h-2v-1h-1v1h-1V9h1V7h-1z"></path>
      </svg>
    </button>
    <div id="start-screen" class="overlay" role="dialog" aria-label="启动画面，点击继续" tabindex="0">
      <div id="opening-art" aria-hidden="true"></div>
      <div class="opening-shade" aria-hidden="true"></div>
      <div class="opening-content">
        <div class="opening-copy">
          <p id="start-subtitle">宇宙裂缝已被贝果怪物撕开，向前奔跑，唯一目标是在坍塌彻底失控前逃出生天</p>
        </div>
      </div>
    </div>
    <div id="story-screen" class="overlay" role="dialog" aria-label="情景画面，点击继续" tabindex="0" style="display:none;">
      <div id="story-slide" aria-hidden="true"></div>
      <div class="opening-shade" aria-hidden="true"></div>
      <div class="opening-content">
        <div class="opening-copy">
          <h2 id="story-title">贝果降临</h2>
          <p id="story-caption">它悬在星海中俯视一切。吞噬、扭曲、追逐，所有宇宙都被卷进同一场疯狂之中。</p>
        </div>
      </div>
    </div>
    <div id="gate-screen" class="overlay" role="dialog" aria-label="教学关卡" style="display:none;">
      <h2 id="gate-title">教学关卡</h2>
      <button id="gate-button" type="button">点击进入石头宇宙</button>
    </div>
    <div id="victory-screen" class="overlay" role="dialog" aria-label="通关" style="display:none;">
      <div style="position:relative;width:340px;height:340px;display:grid;place-items:center;">
        <div id="victory-ring" aria-hidden="true"></div>
        <div id="victory-core" aria-hidden="true"></div>
      </div>
      <h2 id="victory-title">通关</h2>
      <p id="victory-subtitle">第2关已完成。返回启动页可以再次观看情景画面。</p>
      <button id="victory-button" type="button">返回启动页</button>
    </div>
    <div id="fatal-error">哎呀，出错了，请重启试试吧~</div>
  </div>

  <script src="js/levels/universeParams.js"></script>
  <script>
    (function enforceNumberPlanConfigForMerge() {
      'use strict';

      if (!window.ULEAP_CONFIG || !window.ULEAP_CONFIG.GAME_CONFIG || !window.ULEAP_CONFIG.UNIVERSES) {
        return;
      }

      var cfg = window.ULEAP_CONFIG.GAME_CONFIG;
      cfg.logicWidth = 720;
      cfg.logicHeight = 1280;
      cfg.mapCols = 11;
      cfg.mapRows = 15;
      cfg.tileSize = 60;
      cfg.playerRadius = 13;
      cfg.playerSpeed = 140;
      cfg.bagelRadius = 12;
      cfg.fragmentRadius = 8;
      cfg.initialCollapse = 50;
      cfg.safeSpawnDistanceFromPlayer = 170;
      cfg.hitPenalty = 12;
      cfg.nearBagelDistance = 150;
      cfg.nearBagelInnerDistance = 90;
      cfg.chaseDecisionInterval = 0.18;
      cfg.wanderDecisionInterval = 0.6;
      cfg.stuckCheckInterval = 0.9;
      cfg.tutorialUniverse = 'stone';
      cfg.fragmentConcurrent = 7;
      cfg.skillButtonRadius = 42;
      cfg.uiEdgePadding = 6;

      cfg.tutorialCollapseBaseRate = 0.5;
      cfg.formalCollapseSplitTime = 30;
      cfg.formalCollapseBaseRate1 = 1.2;
      cfg.formalCollapseBaseRate2 = 2.0;
      cfg.tutorialNearBagelOuterAdd = 0.8;
      cfg.tutorialNearBagelInnerAdd = 1.2;
      cfg.formalNearBagelOuterMultiplier = 1.5;
      cfg.formalNearBagelInnerMultiplier = 2.5;

      cfg.tutorialFragmentRelief = 8;
      cfg.tutorialFragmentRespawnDelay = 2.5;
      cfg.formalFragmentRelief = 5;
      cfg.formalFragmentRespawnDelay = 2.0;
      cfg.formalFragmentFloorTrigger = 3;
      cfg.formalFragmentFloor = 5;

      cfg.tutorialSkillEnabled = false;
      cfg.formalSkillCooldown = 13;
      cfg.formalSkillRelief = 15;

      window.ULEAP_CONFIG.UNIVERSE_WEIGHTS = {
        stone: 0.2,
        laundromat: 0.25,
        hotdog: 0.25,
        kungfu: 0.3
      };

      var universes = window.ULEAP_CONFIG.UNIVERSES;
      if (universes.stone) {
        universes.stone.pursuerCount = 1;
        universes.stone.speed = 80;
        universes.stone.perception = 60;
      }
      if (universes.laundromat) {
        universes.laundromat.pursuerCount = 3;
        universes.laundromat.speed = 120;
        universes.laundromat.perception = 100;
      }
      if (universes.hotdog) {
        universes.hotdog.pursuerCount = 5;
        universes.hotdog.speed = 80;
        universes.hotdog.perception = 100;
      }
      if (universes.kungfu) {
        universes.kungfu.pursuerCount = 3;
        universes.kungfu.speed = 80;
        universes.kungfu.perception = 160;
      }
    })();
  </script>
  <script src="js/levels/mapTemplates.js"></script>
  <script src="js/gameplay/utils.js"></script>
  <script src="js/gameplay/input.js"></script>
  <script src="js/gameplay/entities.js"></script>
  <script src="js/gameplay/game.js"></script>
  <script>
    (function enforceNumberGameplayForMerge() {
      'use strict';

      if (!window.ULEAP_Game || !window.ULEAP_CONFIG || !window.ULEAP_UTILS) {
        return;
      }

      var Game = window.ULEAP_Game;
      var utils = window.ULEAP_UTILS;

      function shallowClone(obj) {
        var out = {};
        for (var k in obj) {
          if (Object.prototype.hasOwnProperty.call(obj, k)) {
            out[k] = obj[k];
          }
        }
        return out;
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function getPlayerRenderSize(tile) {
        return Math.max(44, Math.min(tile - 8, Math.round(tile * 0.86)));
      }

      function getPlayerMatrixSpec(key) {
        if (key === 'stone') {
          return { cols: 10, rows: 10, maxDim: 10, minDim: 10 };
        }
        if (key === 'hotdog') {
          return { cols: 20, rows: 24, maxDim: 24, minDim: 20 };
        }
        if (key === 'kungfu') {
          return { cols: 24, rows: 24, maxDim: 24, minDim: 24 };
        }
        return { cols: 16, rows: 24, maxDim: 24, minDim: 16 };
      }

      function computePlayerRadius(tile, key) {
        var size = getPlayerRenderSize(tile);
        var spec = getPlayerMatrixSpec(key);
        var block = Math.max(1, Math.floor(size / spec.maxDim));
        var minDraw = spec.minDim * block;
        var radius = Math.floor(minDraw * 0.5) - 1;
        return clamp(radius, 8, Math.floor(tile * 0.5) - 2);
      }

      function computeBagelRadius(tile) {
        var render = Math.min(tile - 6, Math.round(tile * 0.9));
        var radius = Math.floor(render * 0.5) - 2;
        return clamp(radius, 8, Math.floor(tile * 0.5) - 2);
      }

      function computeFragmentRadius(tile) {
        var baseSize = Math.max(26, Math.min(tile - 16, Math.round(tile * 0.72)));
        var radius = Math.floor(baseSize * 0.5) - 2;
        return clamp(radius, 6, Math.floor(tile * 0.5) - 8);
      }

      function syncCollisionRadii(game, universeKey) {
        var tile = game.map && game.map.tileSize ? game.map.tileSize : game.config.tileSize;
        var playerR = computePlayerRadius(tile, universeKey);
        var bagelR = computeBagelRadius(tile);
        var fragR = computeFragmentRadius(tile);

        game.config.playerRadius = playerR;
        game.config.bagelRadius = bagelR;
        game.config.fragmentRadius = fragR;

        if (game.player) {
          game.player.radius = playerR;
        }

        if (game.pursuers && game.pursuers.length) {
          for (var i = 0; i < game.pursuers.length; i += 1) {
            game.pursuers[i].radius = bagelR;
          }
        }

        if (game.fragments && game.fragments.length) {
          for (var j = 0; j < game.fragments.length; j += 1) {
            game.fragments[j].radius = fragR;
          }
        }
      }

      Game.prototype.getUniverseWeight = function getUniverseWeight(key) {
        var weights = window.ULEAP_CONFIG.UNIVERSE_WEIGHTS || {};
        var w = weights[key];
        return typeof w === 'number' && w > 0 ? w : 0;
      };

      var originalGetUniverse = Game.prototype.getUniverse;
      Game.prototype.getUniverseForStage = function getUniverseForStage(key) {
        var universe = originalGetUniverse.call(this, key);
        if (this.stage === 'formal' && universe && universe.key === 'stone') {
          var clone = shallowClone(universe);
          clone.pursuerCount = 2;
          clone.speed = 70;
          clone.perception = 60;
          return clone;
        }
        return universe;
      };

      Game.prototype.getRandomUniverseKey = function getRandomUniverseKey(excludeKey) {
        var candidates = [];
        var i;
        for (i = 0; i < this.universePool.length; i += 1) {
          if (this.universePool[i] !== excludeKey) {
            candidates.push(this.universePool[i]);
          }
        }
        if (!candidates.length) {
          candidates = this.universePool.slice();
        }

        var total = 0;
        for (i = 0; i < candidates.length; i += 1) {
          total += this.getUniverseWeight(candidates[i]);
        }
        if (!total) {
          return utils.pickRandom(candidates);
        }

        var roll = Math.random() * total;
        for (i = 0; i < candidates.length; i += 1) {
          roll -= this.getUniverseWeight(candidates[i]);
          if (roll <= 0) {
            return candidates[i];
          }
        }
        return candidates[candidates.length - 1];
      };

      Game.prototype.applyUniverse = function applyUniverse(key, silent) {
        var universe = this.getUniverseForStage(key);
        var i;
        window.ULEAP_CURRENT_UNIVERSE_KEY = universe.key;
        this.currentUniverseKey = universe.key;
        this.currentUniverse = universe;
        this.player.color = universe.player;
        this.pursuers = [];

        syncCollisionRadii(this, universe.key);

        for (i = 0; i < universe.pursuerCount; i += 1) {
          this.pursuers.push(this.createPursuerAtSpawn(i));
        }

        if (this.pursuers && this.pursuers.length) {
          for (i = 0; i < this.pursuers.length; i += 1) {
            this.pursuers[i].radius = this.config.bagelRadius;
          }
        }

        for (i = 0; i < this.fragments.length; i += 1) {
          this.fragments[i].color = universe.fragment;
          this.fragments[i].radius = this.config.fragmentRadius;
        }

        if (!silent) {
          this.addToast('跃迁至 ' + universe.label + '。');
        }
      };

      Game.prototype.resetPursuerPosition = function resetPursuerPosition(pursuer) {
        var i;
        var candidateCell;
        var candidate;
        var best = null;
        var bestDistance = -1;

        for (i = 0; i < this.map.pursuerSpawns.length; i += 1) {
          candidateCell = this.map.pursuerSpawns[i];
          candidate = utils.cellToWorldCenter(candidateCell.col, candidateCell.row, this.map.tileSize);
          var dist = utils.distance(candidate.x, candidate.y, this.player.x, this.player.y);
          if (dist > bestDistance) {
            bestDistance = dist;
            best = { x: candidate.x, y: candidate.y, spawnIndex: i };
          }
        }

        if (best) {
          pursuer.x = best.x;
          pursuer.y = best.y;
          pursuer.spawnIndex = best.spawnIndex;
          pursuer.dirX = 0;
          pursuer.dirY = 0;
          pursuer.decisionTimer = 0;
          pursuer.wanderTarget = null;
        }
      };

      Game.prototype.collectFragment = function collectFragment(fragment) {
        var cfg = this.config;
        fragment.active = false;
        fragment.respawnAt = this.elapsed + (this.stage === 'tutorial' ? cfg.tutorialFragmentRespawnDelay : cfg.formalFragmentRespawnDelay);
        this.collectedTotal += 1;
        if (this.stage === 'tutorial') {
          this.collectedTutorial += 1;
        }
        var relief = this.stage === 'tutorial' ? cfg.tutorialFragmentRelief : cfg.formalFragmentRelief;
        this.collapse = utils.clamp(this.collapse - relief, 0, 100);
      };

      function countActiveFragments(game) {
        var active = 0;

      }

      entities.drawFragment = function drawFragment(ctx, fragment, time) {
        var key = window.ULEAP_CURRENT_UNIVERSE_KEY || 'stone';
        var tile = getRenderTileSize(60);
        var pulse = 1 + Math.sin(time * 5 + fragment.id) * 0.10;
        var baseSize = Math.max(26, Math.min(tile - 16, Math.round(tile * 0.72)));
        var size = Math.round(Math.min(tile - 12, baseSize * pulse));

        if (key === 'laundromat') {
          drawGridSpriteAt(ctx, fragment.x, fragment.y, size, coinM, coinPalette, 12);

          var block = Math.max(1, Math.floor(size / 12));
          var drawW = 12 * block;
          var x0 = Math.round(fragment.x - drawW * 0.5);
          var y0 = Math.round(fragment.y - drawW * 0.5);
          var signW = coinS[0].length * block;
          var signH = coinS.length * block;
          var sx = x0 + ((drawW - signW) >> 1);
          var sy = y0 + ((drawW - signH) >> 1);

          ctx.save();
          ctx.imageSmoothingEnabled = false;
          for (var r = 0; r < coinS.length; r += 1) {
            for (var c = 0; c < coinS[r].length; c += 1) {
              var v = coinS[r][c];
              if (!v) {
                continue;
              }
              ctx.fillStyle = coinPalette[v];
              ctx.fillRect(sx + c * block, sy + r * block, block, block);
            }
          }
          ctx.fillStyle = '#FFFFFF';
          ctx.globalAlpha = 0.85;
          ctx.fillRect(x0 + 5 * block, y0 + 2 * block, block, block);
          ctx.fillRect(x0 + 8 * block, y0 + 4 * block, block, block);
          ctx.restore();
          return;
        }

        if (key === 'hotdog') {
          drawGridSpriteAt(ctx, fragment.x, fragment.y, size, handGrid, handPalette, 32);
          return;
        }

        if (key === 'kungfu') {
          drawGridSpriteAt(ctx, fragment.x, fragment.y, size, trophyGrid, trophyPalette, 32);
          return;
        }

        ctx.save();
        ctx.translate(fragment.x - size * 0.5, fragment.y - size * 0.5);
        drawFragmentSprite(ctx, 0, 0, size / 32);
        ctx.restore();
      };

      var storySlide = document.getElementById('story-slide');
      if (storySlide) {
        storySlide.style.backgroundImage = 'url(' + backgroundSources.stone + ')';
      }
    })();
  </script>

        }
      ]
    };
  </script>
