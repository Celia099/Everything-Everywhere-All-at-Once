<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>预览台 - 瞬息全宇宙：逃离贝果</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050814;
      --panel: rgba(10, 15, 37, 0.86);
      --line: rgba(111, 206, 255, 0.22);
      --text: rgba(245, 247, 255, 0.92);
      --muted: rgba(245, 247, 255, 0.62);
      --accent: #74f2ce;
      --accent-2: #ffbf69;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 20%, rgba(31, 66, 146, 0.24), transparent 30%),
        radial-gradient(circle at 80% 18%, rgba(52, 115, 119, 0.18), transparent 24%),
        radial-gradient(circle at 50% 120%, rgba(139, 48, 84, 0.14), transparent 38%),
        var(--bg);
      color: var(--text);
      font-family: "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    body {
      padding:
        env(safe-area-inset-top, 0)
        env(safe-area-inset-right, 0)
        env(safe-area-inset-bottom, 0)
        env(safe-area-inset-left, 0);
    }

    .shell {
      position: fixed;
      inset: 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 12px;
      padding: 14px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(10, 15, 37, 0.92), var(--panel));
      backdrop-filter: blur(10px);
    }

    .brand {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand__title {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.06em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand__hint {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.18s ease, border-color 0.18s ease;
      user-select: none;
      touch-action: manipulation;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn--accent {
      border-color: rgba(116, 242, 206, 0.34);
      background: rgba(116, 242, 206, 0.12);
    }

    .btn--accent2 {
      border-color: rgba(255, 191, 105, 0.34);
      background: rgba(255, 191, 105, 0.12);
    }

    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: 1fr;
      min-height: 0;
    }

    .panel {
      border: 1px solid var(--line);
      background: rgba(10, 15, 37, 0.52);
      backdrop-filter: blur(8px);
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
      overflow: hidden;
    }

    .panel__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .panel__title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(245, 247, 255, 0.86);
    }

    .panel__meta {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .stage {
      display: grid;
      place-items: center;
      padding: 10px;
      min-height: 0;
    }

    .frame-wrap {
      width: min(100%, calc(100vh * 0.5625));
      height: min(100%, calc(100vw / 0.5625));
      max-width: 720px;
      max-height: 1280px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow:
        0 22px 70px rgba(0, 0, 0, 0.52),
        0 0 0 1px rgba(255, 255, 255, 0.06) inset;
      background: #0b0f24;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #070a18;
    }

    .notice {
      margin-left: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255, 191, 105, 0.26);
      background: rgba(255, 191, 105, 0.1);
      color: rgba(255, 247, 223, 0.92);
      border-radius: 12px;
      font-size: 12px;
      display: none;
    }

    .notice--show {
      display: inline-flex;
      align-items: center;
    }

    @media (max-width: 980px) {
      .shell {
        padding: 12px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .frame-wrap {
        max-width: 540px;
        max-height: 960px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">
        <div class="brand__title">预览台（Index + Engine + Play）</div>
        <div class="brand__hint" id="hint">Index 仅做导航预览：Engine 启动后会自动载入 Play</div>
      </div>
      <div class="actions">
        <button class="btn btn--accent" id="reload">刷新页面</button>
        <button class="btn" id="swap">切换布局</button>
        <button class="btn btn--accent2" id="open-engine">新标签打开 Engine</button>
        <button class="btn btn--accent2" id="open-play">新标签打开 Play</button>
        <span class="notice" id="notice">建议使用本地服务预览（file:// 模式可能有差异）</span>
      </div>
    </div>

    <div class="grid" id="grid">
      <section class="panel">
        <header class="panel__head">
          <div class="panel__title">Engine</div>
          <div class="panel__meta">engine.html</div>
        </header>
        <div class="stage">
          <div class="frame-wrap">
            <div style="width:100%;height:100%;display:grid;place-items:center;padding:22px;background:linear-gradient(180deg, rgba(12, 18, 46, 0.72), rgba(10, 15, 37, 0.42));">
              <div style="max-width:420px;text-align:center;">
                <div style="font-weight:800;font-size:18px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,247,255,0.9);">Engine 入口</div>
                <div style="margin-top:10px;font-size:13px;line-height:1.7;color:rgba(245,247,255,0.68);">程序启动入口为 engine.html。引擎初始化完成后，会自动跳转加载 play.html 关卡内容。</div>
                <div style="margin-top:14px;display:inline-flex;gap:10px;flex-wrap:wrap;justify-content:center;">
                  <button class="btn btn--accent2" type="button" id="open-engine-inline">打开 Engine（链式进入 Play）</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script>
    (function () {
      var grid = document.getElementById("grid");
      var notice = document.getElementById("notice");

      function reloadAll() {
        window.location.reload();
      }

      document.getElementById("reload").addEventListener("click", reloadAll);

      document.getElementById("swap").addEventListener("click", function () {
        var computed = window.getComputedStyle(grid);
        var columns = computed.gridTemplateColumns.split(" ").filter(Boolean).length;
        if (columns >= 2) {
          grid.style.gridTemplateColumns = "1fr";
        } else {
          grid.style.gridTemplateColumns = "1fr 1fr";
        }
      });

      document.getElementById("open-engine").addEventListener("click", function () {
        window.open("./engine.html", "_blank", "noopener,noreferrer");
      });

      document.getElementById("open-play").addEventListener("click", function () {
        window.open("./play.html", "_blank", "noopener,noreferrer");
      });

      document.getElementById("open-engine-inline").addEventListener("click", function () {
        window.open("./engine.html", "_blank", "noopener,noreferrer");
      });

      if (location.protocol === "file:") {
        notice.classList.add("notice--show");
      }
    })();
  </script>
</body>
</html>
