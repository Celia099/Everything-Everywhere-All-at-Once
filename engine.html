<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="format-detection" content="telephone=no">
  <title>瞬息全宇宙：逃离贝果</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090909;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff7df;
      touch-action: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      position: relative;
      width: min(100vw, calc(100vh * 0.5625));
      height: min(100vh, calc(100vw / 0.5625));
      max-width: 720px;
      max-height: 1280px;
      overflow: hidden;
      background: #111;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #0f0f12;
      touch-action: none;
    }

    #fatal-error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      background: rgba(0, 0, 0, 0.86);
      color: #fff7df;
      font-size: 28px;
      line-height: 1.5;
      z-index: 10;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 28px;
      text-align: center;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 420ms ease, transform 420ms ease;
    }

    .overlay.overlay--show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .overlay.overlay--hide {
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
    }

    #start-screen {
      background:
        radial-gradient(circle at 30% 30%, rgba(255, 217, 102, 0.12), transparent 42%),
        radial-gradient(circle at 70% 75%, rgba(116, 242, 206, 0.1), transparent 46%),
        rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      z-index: 9;
    }

    #start-title {
      margin: 0;
      font-size: 40px;
      letter-spacing: 0.08em;
      color: rgba(255, 247, 223, 0.96);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    #start-subtitle {
      margin: 14px 0 0 0;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255, 247, 223, 0.78);
    }

    #start-button {
      margin-top: 22px;
      appearance: none;
      border: 2px solid rgba(255, 217, 102, 0.7);
      background: rgba(255, 217, 102, 0.14);
      color: rgba(255, 247, 223, 0.96);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    }

    #start-button:active {
      transform: translateY(1px);
    }

    #story-screen {
      padding: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9;
    }

    #story-slide {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 25% 25%, rgba(116, 242, 206, 0.14), transparent 38%),
        radial-gradient(circle at 70% 80%, rgba(255, 191, 105, 0.12), transparent 44%),
        #04050a;
      transform: scale(1);
    }

    #story-slide.story-slide--play {
      animation: storyZoom 3200ms ease forwards;
    }

    #story-caption {
      position: relative;
      z-index: 1;
      padding: 18px 20px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.38);
      color: rgba(255, 247, 223, 0.92);
      font-size: 18px;
      letter-spacing: 0.06em;
      min-width: min(520px, calc(100% - 56px));
    }

    #gate-screen {
      background:
        radial-gradient(circle at 40% 30%, rgba(255, 217, 102, 0.12), transparent 42%),
        radial-gradient(circle at 70% 75%, rgba(116, 242, 206, 0.1), transparent 46%),
        rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(8px);
      z-index: 9;
    }

    #gate-title {
      margin: 0;
      font-size: 34px;
      letter-spacing: 0.08em;
      color: rgba(255, 247, 223, 0.96);
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
    }

    #gate-subtitle {
      margin: 14px 0 0 0;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255, 247, 223, 0.78);
    }

    #gate-button {
      margin-top: 22px;
      appearance: none;
      border: 2px solid rgba(255, 217, 102, 0.7);
      background: rgba(255, 217, 102, 0.14);
      color: rgba(255, 247, 223, 0.96);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    }

    #gate-button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    #gate-button:active {
      transform: translateY(1px);
    }

    #victory-screen {
      background:
        radial-gradient(circle at 35% 30%, rgba(116, 242, 206, 0.18), transparent 46%),
        radial-gradient(circle at 70% 75%, rgba(255, 217, 102, 0.16), transparent 50%),
        rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      z-index: 9;
    }

    #victory-ring {
      width: 340px;
      height: 340px;
      border-radius: 999px;
      background: conic-gradient(
        from 0deg,
        rgba(116, 242, 206, 0.0),
        rgba(116, 242, 206, 0.55),
        rgba(255, 217, 102, 0.55),
        rgba(255, 107, 94, 0.45),
        rgba(116, 242, 206, 0.0)
      );
      filter: blur(0.2px);
      animation: victorySpin 2200ms linear infinite;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65);
    }

    #victory-core {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 999px;
      background: radial-gradient(circle at 40% 35%, rgba(255, 247, 223, 0.12), rgba(0, 0, 0, 0));
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.08) inset,
        0 0 0 22px rgba(0, 0, 0, 0.22) inset;
      animation: victoryPulse 1400ms ease-in-out infinite;
    }

    #victory-title {
      margin: 22px 0 0 0;
      font-size: 40px;
      letter-spacing: 0.12em;
      color: rgba(255, 247, 223, 0.96);
      text-shadow: 0 14px 60px rgba(0, 0, 0, 0.75);
    }

    #victory-subtitle {
      margin: 12px 0 0 0;
      max-width: 560px;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(255, 247, 223, 0.78);
    }

    #victory-button {
      margin-top: 22px;
      appearance: none;
      border: 2px solid rgba(116, 242, 206, 0.6);
      background: rgba(116, 242, 206, 0.12);
      color: rgba(255, 247, 223, 0.96);
      border-radius: 16px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
    }

    #victory-button:active {
      transform: translateY(1px);
    }

    @keyframes storyZoom {
      from {
        transform: scale(1.08);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes victorySpin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes victoryPulse {
      0% {
        transform: scale(0.98);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
      }
      100% {
        transform: scale(0.98);
        opacity: 0.85;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas" width="720" height="1280" aria-label="瞬息全宇宙：逃离贝果"></canvas>
    <div id="start-screen" class="overlay" role="dialog" aria-label="启动画面">
      <h1 id="start-title">瞬息全宇宙</h1>
      <p id="start-subtitle">启动完成后，将播放两段情景画面。</p>
      <button id="start-button" type="button">进入</button>
    </div>
    <div id="story-screen" class="overlay" role="dialog" aria-label="情景画面" style="display:none;">
      <div id="story-slide" aria-hidden="true"></div>
      <div id="story-caption">情景画面 1 / 2</div>
    </div>
    <div id="gate-screen" class="overlay" role="dialog" aria-label="关卡确认" style="display:none;">
      <h2 id="gate-title">确认开始第1关？</h2>
      <p id="gate-subtitle">点击确认后进入第1关。</p>
      <button id="gate-button" type="button">开始第1关</button>
    </div>
    <div id="victory-screen" class="overlay" role="dialog" aria-label="通关" style="display:none;">
      <div style="position:relative;width:340px;height:340px;display:grid;place-items:center;">
        <div id="victory-ring" aria-hidden="true"></div>
        <div id="victory-core" aria-hidden="true"></div>
      </div>
      <h2 id="victory-title">通关</h2>
      <p id="victory-subtitle">第2关已完成。返回启动页可以再次观看情景画面。</p>
      <button id="victory-button" type="button">返回启动页</button>
    </div>
    <div id="fatal-error">哎呀，出错了，请重启试试吧~</div>
  </div>

  <script src="js/levels/universeParams.js"></script>
  <script src="js/levels/mapTemplates.js"></script>
  <script src="js/gameplay/utils.js"></script>
  <script src="js/gameplay/input.js"></script>
  <script src="js/gameplay/entities.js"></script>
  <script src="js/gameplay/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
